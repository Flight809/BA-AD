
name: Build Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build BA-AD for Android ARM64
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -o ./jniLibs build --release

      - name: Prepare Binary
        run: |
          mkdir -p output
          if [ -f "./jniLibs/arm64-v8a/libbaad.so" ]; then
            cp ./jniLibs/arm64-v8a/libbaad.so ./output/baad
          elif [ -f "target/aarch64-linux-android/release/baad" ]; then
            cp target/aarch64-linux-android/release/baad ./output/baad
          fi
          chmod +x ./output/baad

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: baad-android-arm64
          path: output/baad
          
