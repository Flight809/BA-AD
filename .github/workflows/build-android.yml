name: Build Android ARM64

on:
  workflow_dispatch: # 允许手动点击按钮触发构建

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross (Rust 交叉编译工具)
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build BA-AD for Android ARM64
        run: cross build --target aarch64-linux-android --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: baad-android-arm64
          path: target/aarch64-linux-android/release/baad
          
